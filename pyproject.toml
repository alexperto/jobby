[project]
name = "jobby"
version = "0.1.0"
description = "Agentic job-search tool: resume -> target roles -> matching openings."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pypdf>=4.3",
    "openai>=1.50",
    "tavily-python>=0.5",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "mypy>=1.11",
]

[tool.uv]
package = false
